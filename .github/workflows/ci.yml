name: Gitea Deploy

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.ASUS_IP }}
          username: ${{ secrets.ASUS_USER }}
          password: ${{ secrets.ASUS_PASSWORD }}
          script: |
            mkdir -p /opt/gitea
            cd /opt/gitea

            export COMPOSE_HTTP_TIMEOUT=300
            which docker-compose || apt install docker-compose -y

            cat > docker-compose.yml << 'EOF'
            services:
              gitea:
                image: gitea/gitea:latest
                ports:
                  - "8082:3000"
                  - "2222:22"
                environment:
                  - GITEA__database__DB_TYPE=postgres
                  - GITEA__database__HOST=db:5432
                  - GITEA__database__NAME=gitea
                  - GITEA__database__USER=gitea
                  - GITEA__database__PASSWD=gitea
                volumes:
                  - gitea_data:/data
                depends_on:
                  - db

              db: 
                image: postgres:15
                environment:
                  - POSTGRES_DB=gitea
                  - POSTGRES_USER=gitea
                  - POSTGRES_PASSWORD=gitea
                volumes:
                  - db_data:/var/lib/postgresql/data
            
            volumes:
              gitea_data:
              db_data: 
            EOF

            docker-compose down || true
            docker-compose up -d

      - name: Send notification to Telegram
        uses: appleboy/telegram-action@master
        if: always()
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          message: |
            *Gitea Deploy* #${{ github.run_number }}
            *Статус* ${{ job.status }}
            *Автор* ${{ github.actor }}
            *Ссылка* https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
      
